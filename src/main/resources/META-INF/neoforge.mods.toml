modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
ИИ-компаньон Райя Прайм (модуль П.Е.Р.С.И.К.) по мотивам LP «Идеальный мир».
Летающее тело, общение голосом (Simple Voice Chat) и текстом через облачный Gemini API,
понимает блоки/предметы/мобов/рецепты установленных модов, ломает и ставит блоки, сражается,
носит вещи в своём инвентаре и прячется за игроком или за укрытиями.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Simple Voice Chat (modId = "voicechat"). Необязателен: без него Райя работает через чат/команды.
[[dependencies.${mod_id}]]
    modId="voicechat"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
